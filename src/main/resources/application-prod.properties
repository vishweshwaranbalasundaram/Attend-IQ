attendiq.auth.otp-preview-enabled=false
attendiq.auth.dev-auth-bypass=false
attendiq.auth.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:example.edu}
attendiq.firebase.project-id=${FIREBASE_PROJECT_ID}
attendiq.attendance.qr-hmac-secret=${ATTENDIQ_QR_HMAC_SECRET}
attendiq.attendance.campus-lat=${CAMPUS_LAT}
attendiq.attendance.campus-lng=${CAMPUS_LNG}
spring.datasource.url=${ATTENDIQ_DB_URL:jdbc:mysql:///${ATTENDIQ_DB_NAME}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&user=${ATTENDIQ_DB_USER}&password=${ATTENDIQ_DB_PASSWORD}}
spring.flyway.placeholders.allowed_email_domain=${ALLOWED_EMAIL_DOMAIN}
