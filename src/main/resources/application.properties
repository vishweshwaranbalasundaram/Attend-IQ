spring.application.name=attendiq
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${ATTENDIQ_DB_URL:jdbc:mysql://localhost:3306/attendiq_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ATTENDIQ_DB_USER:root}
spring.datasource.password=${ATTENDIQ_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.sql.init.mode=never
server.error.include-message=always
attendiq.institution-name=${ATTENDIQ_INSTITUTION_NAME:Your Institution}
attendiq.auth.allowed-email-domains=${ALLOWED_EMAIL_DOMAIN:.edu,.edu.in,.ac.in}
attendiq.auth.jwt-secret=${ATTENDIQ_JWT_SECRET:local-development-only-change-this-secret-32-bytes-min}
attendiq.auth.token-hours=${ATTENDIQ_TOKEN_HOURS:8}
attendiq.auth.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:example.edu}
attendiq.auth.dev-auth-bypass=${DEV_AUTH_BYPASS:false}
attendiq.firebase.project-id=${FIREBASE_PROJECT_ID:demo-attendiq}
attendiq.attendance.qr-hmac-secret=${ATTENDIQ_QR_HMAC_SECRET:local-qr-signing-secret-change-before-deployment}
attendiq.attendance.session-minutes=${ATTENDIQ_SESSION_MINUTES:10}
attendiq.attendance.grace-minutes=${ATTENDIQ_GRACE_MINUTES:5}
attendiq.attendance.late-cutoff-minutes=${ATTENDIQ_LATE_CUTOFF_MINUTES:10}
attendiq.attendance.campus-lat=${CAMPUS_LAT:0.0000}
attendiq.attendance.campus-lng=${CAMPUS_LNG:0.0000}
attendiq.attendance.geofence-radius-meters=${GEOFENCE_RADIUS_METERS:150}
attendiq.attendance.max-gps-accuracy-meters=${MAX_GPS_ACCURACY_METERS:50}
attendiq.auth.otp-preview-enabled=${ATTENDIQ_OTP_PREVIEW_ENABLED:true}
attendiq.auth.otp-expiry-minutes=${ATTENDIQ_OTP_EXPIRY_MINUTES:10}
attendiq.smtp.enabled=${ATTENDIQ_SMTP_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
attendiq.mail.from=${SMTP_FROM:no-reply@attendiq.local}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
