<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="gPres" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="gServ" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <linearGradient id="gRepo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="gDb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
  </defs>
  <rect width="960" height="600" rx="18" fill="url(#bg)"/>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#f8fafc">Attend-IQ Layered Architecture</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#94a3b8">Java console app · JDBC · MySQL</text>

  <!-- Presentation -->
  <rect x="40" y="80" width="660" height="100" rx="14" fill="url(#gPres)"/>
  <text x="58" y="104" font-size="15" font-weight="700" fill="#fff">1 · PRESENTATION LAYER</text>
  <g font-size="12" fill="#0f172a" font-weight="600">
    <rect x="58" y="116" width="110" height="46" rx="8" fill="#e0f2fe"/><text x="113" y="144" text-anchor="middle">App (menus)</text>
    <rect x="180" y="116" width="120" height="46" rx="8" fill="#e0f2fe"/><text x="240" y="144" text-anchor="middle">ConsoleUI</text>
    <rect x="312" y="116" width="120" height="46" rx="8" fill="#e0f2fe"/><text x="372" y="144" text-anchor="middle">ConsoleTable</text>
    <rect x="444" y="116" width="120" height="46" rx="8" fill="#e0f2fe"/><text x="504" y="144" text-anchor="middle">ConsoleInput</text>
    <rect x="576" y="116" width="110" height="46" rx="8" fill="#e0f2fe"/><text x="631" y="144" text-anchor="middle">ConsoleStyle</text>
  </g>

  <!-- Service -->
  <rect x="40" y="208" width="660" height="116" rx="14" fill="url(#gServ)"/>
  <text x="58" y="232" font-size="15" font-weight="700" fill="#fff">2 · SERVICE LAYER (rules + transactions)</text>
  <g font-size="12" fill="#3b0764" font-weight="600">
    <rect x="58" y="244" width="150" height="66" rx="8" fill="#f3e8ff"/><text x="133" y="272" text-anchor="middle">AttendanceService</text><text x="133" y="290" text-anchor="middle" font-size="10" font-weight="400">mark · correct · delete</text>
    <rect x="218" y="244" width="140" height="66" rx="8" fill="#f3e8ff"/><text x="288" y="272" text-anchor="middle">BulkAttendance</text><text x="288" y="290" text-anchor="middle" font-size="10" font-weight="400">preview + batch mark</text>
    <rect x="368" y="244" width="150" height="66" rx="8" fill="#f3e8ff"/><text x="443" y="272" text-anchor="middle">AcademicCatalog</text><text x="443" y="290" text-anchor="middle" font-size="10" font-weight="400">faculty · subject · session</text>
    <rect x="528" y="244" width="80" height="66" rx="8" fill="#f3e8ff"/><text x="568" y="272" text-anchor="middle">Student</text><text x="568" y="290" text-anchor="middle" font-size="10" font-weight="400">Service</text>
    <rect x="618" y="244" width="72" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-dasharray="4 3"/><text x="654" y="268" text-anchor="middle" font-size="11">Faculty</text><text x="654" y="283" text-anchor="middle" font-size="11">AuthService</text><text x="654" y="299" text-anchor="middle" font-size="9" font-weight="400">NEW</text>
  </g>

  <!-- Repository -->
  <rect x="40" y="352" width="660" height="100" rx="14" fill="url(#gRepo)"/>
  <text x="58" y="376" font-size="15" font-weight="700" fill="#fff">3 · REPOSITORY LAYER (prepared SQL)</text>
  <g font-size="12" fill="#7c2d12" font-weight="600">
    <rect x="58" y="388" width="170" height="46" rx="8" fill="#ffedd5"/><text x="143" y="416" text-anchor="middle">AttendanceRepository</text>
    <rect x="240" y="388" width="200" height="46" rx="8" fill="#ffedd5"/><text x="340" y="416" text-anchor="middle">JdbcAcademicCatalogRepo</text>
    <rect x="452" y="388" width="130" height="46" rx="8" fill="#ffedd5"/><text x="517" y="416" text-anchor="middle">JdbcAcademicRepo</text>
    <rect x="594" y="388" width="96" height="46" rx="8" fill="#ffedd5"/><text x="642" y="416" text-anchor="middle">Dashboard</text>
  </g>

  <!-- DB -->
  <rect x="40" y="480" width="660" height="96" rx="14" fill="url(#gDb)"/>
  <text x="58" y="504" font-size="15" font-weight="700" fill="#fff">4 · DATA LAYER</text>
  <g font-size="12" fill="#064e3b" font-weight="600">
    <rect x="58" y="516" width="190" height="46" rx="8" fill="#d1fae5"/><text x="153" y="544" text-anchor="middle">Database (env config)</text>
    <rect x="262" y="516" width="190" height="46" rx="8" fill="#d1fae5"/><text x="357" y="544" text-anchor="middle">MySQL Connector/J</text>
    <rect x="466" y="516" width="224" height="46" rx="8" fill="#d1fae5"/><text x="578" y="544" text-anchor="middle">MySQL · attendiq_java</text>
  </g>

  <!-- arrows -->
  <g stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="370" y1="182" x2="370" y2="206"/>
    <line x1="370" y1="326" x2="370" y2="350"/>
    <line x1="370" y1="454" x2="370" y2="478"/>
  </g>

  <!-- side panel -->
  <rect x="724" y="80" width="198" height="236" rx="14" fill="#1e293b" stroke="#475569"/>
  <text x="823" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">Domain records</text>
  <g font-size="12" fill="#e2e8f0" text-anchor="middle">
    <text x="823" y="130">Student · Faculty · Subject</text>
    <text x="823" y="150">Enrollment · ClassSession</text>
    <text x="823" y="170">AttendanceRecord · Audit</text>
    <text x="823" y="190">Percentage · ShortageReport</text>
    <text x="823" y="210">DashboardSummary</text>
  </g>
  <text x="823" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">Enum</text>
  <text x="823" y="264" text-anchor="middle" font-size="12" fill="#e2e8f0">AttendanceStatus</text>
  <text x="823" y="284" text-anchor="middle" font-size="12" fill="#e2e8f0">PRESENT · ABSENT · ON_DUTY</text>

  <rect x="724" y="336" width="198" height="130" rx="14" fill="#1e293b" stroke="#475569"/>
  <text x="823" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#38bdf8">Utilities</text>
  <g font-size="12" fill="#e2e8f0" text-anchor="middle">
    <text x="823" y="386">CsvExporter</text>
    <text x="823" y="406">AttendanceCalculator</text>
    <text x="823" y="426">AttendancePolicy (75%)</text>
    <text x="823" y="446">PasswordHasher (PBKDF2)</text>
  </g>

  <rect x="724" y="486" width="198" height="90" rx="14" fill="#1e293b" stroke="#475569"/>
  <text x="823" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#f472b6">Quality</text>
  <text x="823" y="536" text-anchor="middle" font-size="12" fill="#e2e8f0">JUnit 5 tests</text>
  <text x="823" y="556" text-anchor="middle" font-size="12" fill="#e2e8f0">GitHub Actions + MySQL</text>
</svg>
